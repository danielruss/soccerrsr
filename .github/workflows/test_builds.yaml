name: Test r-universe install

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy: 
      fail-fast: false
      matrix:
        include:
          - os: macos-latest  # apple-silicon arm64
            r: 'release'
          - os: windows-latest
            r: 'release'
          - os: ubuntu-latest
            r: 'release'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      
      - name: Install soccerrsr for r-universe
        run: |
          install.packages(c("assertthat","purrr"))
          install.packages("soccerrsr", repos = c('https://danielruss.r-universe.dev', 'https://cloud.r-project.org'))
        shell: Rscript {0}

      - name: Run test script
        run: Rscript cicd_test/test.R
