name: Test macOS Intel

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test-macos-intel:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Verify Intel runner
        run: |
          test "$(uname -m)" = "x86_64"
          uname -a

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::assertthat
            any::purrr
            any::progress
            any::crayon

      - name: Install soccerrsr from source
        run: R CMD INSTALL --preclean .

      - name: Verify bundled Intel ONNX Runtime
        shell: Rscript {0}
        run: |
          stopifnot(R.version$arch == "x86_64")

          dylib <- system.file(
            "libs",
            .Platform$r_arch,
            "libonnxruntime.1.24.2.dylib",
            package = "soccerrsr"
          )

          stopifnot(file.exists(dylib))
          info <- system2("file", dylib, stdout = TRUE)
          print(info)
          stopifnot(any(grepl("x86_64", info, fixed = TRUE)))

      - name: Run inference smoke test
        run: Rscript cicd_test/test.R
