name: Test source builds

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: macOS Apple Silicon
            id: macos-arm
            os: macos-latest
            r_arch: aarch64
            rust_target: aarch64-apple-darwin
          - name: macOS Intel
            id: macos-intel
            os: macos-15-intel
            r_arch: x86_64
            rust_target: x86_64-apple-darwin
          - name: Windows x86_64
            id: windows
            os: windows-latest
            r_arch: x86_64
            rust_target: x86_64-pc-windows-gnu
          - name: Linux x86_64
            id: linux
            os: ubuntu-latest
            r_arch: x86_64
            rust_target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::assertthat
            any::purrr
            any::progress
            any::crayon

      - name: Verify R architecture
        shell: Rscript {0}
        run: |
          cat("R platform:", R.version$platform, "\n")
          cat("R architecture:", R.version$arch, "\n")
          stopifnot(R.version$arch == "${{ matrix.config.r_arch }}")

      - name: Install soccerrsr from source
        run: R CMD INSTALL --preclean .

      - name: Verify bundled Intel macOS ONNX Runtime
        if: matrix.config.id == 'macos-intel'
        shell: Rscript {0}
        run: |
          library(soccerrsr)
          dylib <- system.file(
            "libs",
            .Platform$r_arch,
            "libonnxruntime.1.24.2.dylib",
            package = "soccerrsr"
          )

          stopifnot(file.exists(dylib))
          stopifnot(normalizePath(Sys.getenv("ORT_DYLIB_PATH")) == normalizePath(dylib))
          info <- system2("file", dylib, stdout = TRUE)
          print(info)
          stopifnot(any(grepl("x86_64", info, fixed = TRUE)))

      - name: Verify bundled Windows ONNX Runtime
        if: matrix.config.id == 'windows'
        shell: Rscript {0}
        run: |
          library(soccerrsr)
          dll <- system.file(
            "libs",
            .Platform$r_arch,
            "onnxruntime.dll",
            package = "soccerrsr"
          )

          stopifnot(file.exists(dll))
          stopifnot(normalizePath(Sys.getenv("ORT_DYLIB_PATH")) == normalizePath(dll))

      - name: Run inference smoke test
        run: Rscript cicd_test/test.R
