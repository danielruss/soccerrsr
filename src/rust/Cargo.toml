[package]
name = 'soccerrsr'
publish = false
version = '0.1.3-1'
edition = '2021'
rust-version = '1.85'

[lib]
crate-type = [ "rlib", "staticlib"]
name = 'soccerrsr'

[[bin]]
name = 'document'
path = 'document.rs'
bench = false

[dependencies]
extendr-api = "0.9"
indicatif = "0.17.8"
soccer-rs = "0.2.0"

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "api-24"] }

[dev-dependencies]
extendr-engine = "0.9"

[profile.release]
lto = true
codegen-units = 1
